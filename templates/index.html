<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Phishing Email Detector</title>
    <!-- Google Font Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            padding: 20px;
            background: radial-gradient(circle at 50% 50%, #0b1329 0%, #020617 100%);
            min-height: 100vh;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            display: inline-block;
        }
        textarea {
            width: 100%;
            height: 220px;
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.3s;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .button-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        button {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'Outfit', sans-serif;
        }
        .analyze-button {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            border: 1px solid rgba(34, 197, 94, 0.2);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.15);
        }
        .analyze-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.3);
        }
        .clear-button {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .clear-button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            font-size: 1.1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .phishing {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
        .legitimate {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }
        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .model-error {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phishing Email Detector</h1>

        <!-- Display model loading error if any -->
        {% if model_error %}
        <div class="model-error">
            <strong>Warning:</strong> {{ model_error }}
        </div>
        {% endif %}

        <form action="/predict" method="post" id="email-form">
            <label for="email_text">Paste Email Content Below:</label><br>
            <textarea id="email_text" name="email_text" required placeholder="Enter the body of the email you wish to analyze...">{{ email_text or '' }}</textarea><br>

            <div class="button-container">
                <button type="submit" class="analyze-button">Analyze Email</button>
                <button type="button" class="clear-button" onclick="clearTextArea()">Clear Text</button>
            </div>
        </form>

        <!-- Result display area -->
        {% if prediction_text %}
        <div id="result-area" class="result {% if 'Phishing' in prediction_text %}phishing{% elif 'Legitimate' in prediction_text %}legitimate{% else %}error{% endif %}">
             {{ prediction_text }}
        </div>
        {% endif %}
    </div>

    <script>
        function clearTextArea() {
            var textArea = document.getElementById('email_text');
            textArea.value = '';
            var resultArea = document.getElementById('result-area');
            if (resultArea) {
                resultArea.innerHTML = '';
                resultArea.className = 'result';
            }
            textArea.focus();
        }
    </script>
</body>
</html>
